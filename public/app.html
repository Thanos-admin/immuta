<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immuta — Seal anything</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0ede4; color: #0d0d0d; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: #0d0d0d; }
.logo { font-size: 18px; font-weight: 700; color: #f0ede4; letter-spacing: -0.5px; }
.logo em { font-style: normal; color: #818cf8; }
.wallet-btn { background: #f0ede4; color: #0d0d0d; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.wrap { max-width: 600px; margin: 48px auto; padding: 0 24px; }
.card { background: #fff; border: 0.5px solid #ddd8cc; border-radius: 16px; padding: 28px; margin-bottom: 16px; }
.card-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #0d0d0d; }
label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
input[type=file], input[type=text], textarea { width: 100%; padding: 10px 12px; border: 0.5px solid #ddd8cc; border-radius: 8px; font-size: 14px; margin-bottom: 16px; background: #fafaf8; color: #0d0d0d; font-family: system-ui, sans-serif; }
textarea { min-height: 80px; resize: vertical; }
.hash-display { font-family: monospace; font-size: 11px; background: #f0ede4; border: 0.5px solid #ddd8cc; border-radius: 8px; padding: 10px 12px; word-break: break-all; margin-bottom: 16px; color: #444; line-height: 1.5; }
.fee-row { display: flex; align-items: center; justify-content: space-between; background: #f0ede4; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
.fee-label { font-size: 13px; color: #666; }
.fee-amount { font-size: 16px; font-weight: 700; color: #0d0d0d; }
.btn { width: 100%; padding: 14px; background: #0d0d0d; color: #f0ede4; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn:hover { background: #333; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.status { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
.status.info { background: #e8eaf6; color: #3730a3; }
.status.success { background: #dcfce7; color: #166534; }
.status.error { background: #fee2e2; color: #991b1b; }
.step-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #f0ede4; font-size: 13px; color: #666; }
.step-row:last-child { border-bottom: none; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: #e8eaf6; color: #3730a3; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-num.done { background: #dcfce7; color: #166534; }
.step-num.active { background: #0d0d0d; color: #fff; }
.loader { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.char-count { font-size: 11px; color: #999; text-align: right; margin-top: -12px; margin-bottom: 16px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="logo">immu<em>ta</em></div>
  <button class="wallet-btn" id="wallet-btn" onclick="connectWallet()">Connect wallet</button>
</nav>

<div class="wrap">
  <div class="card">
    <div class="card-title">Seal anything</div>

    <label>File</label>
    <input type="file" id="file-input" onchange="onFileChange(this)">

    <label>Or paste text</label>
    <textarea id="text-input" placeholder="Any text, data, or content to seal..." oninput="onTextInput(this)"></textarea>

    <div id="hash-wrap" style="display:none">
      <label>SHA-256 fingerprint</label>
      <div class="hash-display" id="hash-display"></div>
    </div>

    <label>Label</label>
    <input type="text" id="label-input" maxlength="100" placeholder="e.g. Contract v2, Photo evidence, Q3 report" oninput="updateCount('label-input','label-count',100)">
    <div class="char-count" id="label-count">0 / 100</div>

    <label>Note</label>
    <textarea id="note-input" maxlength="500" placeholder="Context, parties involved, what this proves..." oninput="updateCount('note-input','note-count',500)"></textarea>
    <div class="char-count" id="note-count">0 / 500</div>

    <div class="fee-row">
      <span class="fee-label">Sealing fee</span>
      <span class="fee-amount">$1.00 tDAI</span>
    </div>

    <div id="steps" style="display:none;margin-bottom:20px">
      <div class="step-row">
        <div class="step-num" id="step1-num">1</div>
        <div>
          <strong>Approve tDAI</strong><br>
          Allow Immuta to collect the $1 fee. Required once.
        </div>
      </div>
      <div class="step-row">
        <div class="step-num" id="step2-num">2</div>
        <div>
          <strong>Seal on PulseChain</strong><br>
          Permanently records your fingerprint on-chain.
        </div>
      </div>
    </div>

    <button class="btn" id="seal-btn" onclick="sealDocument()">Seal for $1 tDAI</button>
    <div id="seal-status"></div>
  </div>

  <div class="card">
    <div class="card-title">Verify</div>
    <label>File to verify</label>
    <input type="file" id="verify-file" onchange="onVerifyFile(this)">
    <label>Or paste text</label>
    <textarea id="verify-text" placeholder="Paste original content..." oninput="onVerifyText(this)"></textarea>
    <div id="verify-hash-wrap" style="display:none">
      <label>Hash</label>
      <div class="hash-display" id="verify-hash-display"></div>
    </div>
    <button class="btn" onclick="verifyDocument()">Check registry</button>
    <div id="verify-status"></div>
  </div>
</div>

<script>
const CONTRACT_ADDRESS = "0x0C2a0F6289D1Af62fc2C90301f8a0CadcD017e5c";
const TDAI_ADDRESS = "0x826e4e896CC2f5B371Cd7Bb0bd929DB3e3DB67c0";
const CHAIN_ID = 943;

const ABI = [
  "function storeHash(bytes32 _hash, string calldata _label, string calldata _note) external",
  "function getRecord(bytes32 _hash) external view returns (tuple(bytes32 hash, address submitter, uint256 timestamp, string label, string note))",
  "function fee() external view returns (uint256)"
];

const ERC20_ABI = [
  "function approve(address spender, uint256 amount) external returns (bool)",
  "function allowance(address owner, address spender) external view returns (uint256)"
];

let provider, signer, currentHash, verifyHash;

async function connectWallet() {
  if (!window.ethereum) {
    alert("MetaMask not found. Please install MetaMask.");
    return;
  }
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);

    // Switch to PulseChain testnet
    try {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x" + CHAIN_ID.toString(16) }]
      });
    } catch (switchError) {
      if (switchError.code === 4902) {
        await window.ethereum.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: "0x" + CHAIN_ID.toString(16),
            chainName: "PulseChain Testnet V4",
            nativeCurrency: { name: "tPLS", symbol: "tPLS", decimals: 18 },
            rpcUrls: ["https://pulsechain-testnet-rpc.publicnode.com"],
            blockExplorerUrls: ["https://scan.v4.testnet.pulsechain.com"]
          }]
        });
      }
    }

    signer = await provider.getSigner();
    const address = await signer.getAddress();
    const short = address.slice(0,6) + "..." + address.slice(-4);
    document.getElementById("wallet-btn").textContent = short;
  } catch (err) {
    alert("Connection failed: " + err.message);
  }
}

async function sha256(data) {
  const buf = typeof data === "string" ? new TextEncoder().encode(data) : data;
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return "0x" + Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function onFileChange(inp) {
  if (!inp.files[0]) return;
  document.getElementById("text-input").value = "";
  const buf = await inp.files[0].arrayBuffer();
  currentHash = await sha256(buf);
  document.getElementById("hash-display").textContent = currentHash;
  document.getElementById("hash-wrap").style.display = "block";
}

async function onTextInput(inp) {
  if (!inp.value.trim()) { document.getElementById("hash-wrap").style.display = "none"; return; }
  document.getElementById("file-input").value = "";
  currentHash = await sha256(inp.value);
  document.getElementById("hash-display").textContent = currentHash;
  document.getElementById("hash-wrap").style.display = "block";
}

async function onVerifyFile(inp) {
  if (!inp.files[0]) return;
  document.getElementById("verify-text").value = "";
  const buf = await inp.files[0].arrayBuffer();
  verifyHash = await sha256(buf);
  document.getElementById("verify-hash-display").textContent = verifyHash;
  document.getElementById("verify-hash-wrap").style.display = "block";
}

async function onVerifyText(inp) {
  if (!inp.value.trim()) { document.getElementById("verify-hash-wrap").style.display = "none"; return; }
  document.getElementById("verify-file").value = "";
  verifyHash = await sha256(inp.value);
  document.getElementById("verify-hash-display").textContent = verifyHash;
  document.getElementById("verify-hash-wrap").style.display = "block";
}

function updateCount(inputId, countId, max) {
  const len = document.getElementById(inputId).value.length;
  document.getElementById(countId).textContent = len + " / " + max;
}

function setStep(n, state) {
  const el = document.getElementById("step" + n + "-num");
  el.className = "step-num " + state;
  if (state === "done") el.textContent = "✓";
  else el.textContent = n;
}

async function sealDocument() {
  const el = document.getElementById("seal-status");
  const btn = document.getElementById("seal-btn");
  const label = document.getElementById("label-input").value.trim();
  const note = document.getElementById("note-input").value.trim();

  if (!currentHash) { el.className="status error"; el.textContent="Select a file or enter text first."; return; }
  if (!label) { el.className="status error"; el.textContent="Add a label before sealing."; return; }
  if (!signer) { el.className="status error"; el.textContent="Connect your wallet first."; return; }

  document.getElementById("steps").style.display = "block";
  btn.disabled = true;

  try {
    const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    const tdai = new ethers.Contract(TDAI_ADDRESS, ERC20_ABI, signer);
    const userAddress = await signer.getAddress();
    const fee = await contract.fee();

    // Step 1 — check allowance and approve if needed
    setStep(1, "active");
    el.className="status info"; el.innerHTML='<span class="loader"></span> Checking tDAI allowance...';

    const allowance = await tdai.allowance(userAddress, CONTRACT_ADDRESS);
    if (allowance < fee) {
      el.innerHTML='<span class="loader"></span> Approving tDAI — confirm in MetaMask...';
      const approveTx = await tdai.approve(CONTRACT_ADDRESS, fee);
      await approveTx.wait();
    }
    setStep(1, "done");

    // Step 2 — seal
    setStep(2, "active");
    el.innerHTML='<span class="loader"></span> Sealing on PulseChain — confirm in MetaMask...';

    const hashBytes = ethers.getBytes(currentHash);
    const tx = await contract.storeHash(hashBytes, label, note);
    el.innerHTML='<span class="loader"></span> Broadcasting...';
    const receipt = await tx.wait();

    setStep(2, "done");
    el.className="status success";
    el.innerHTML=`Sealed successfully.<br><span style="font-family:monospace;font-size:11px">TX: ${receipt.hash.slice(0,20)}...</span><br><a href="https://scan.v4.testnet.pulsechain.com/tx/${receipt.hash}" target="_blank" style="font-size:12px;color:#166534">View on PulseScan →</a>`;

  } catch (err) {
    el.className="status error";
    el.textContent = "Error: " + (err.reason || err.message);
  }

  btn.disabled = false;
}

async function verifyDocument() {
  const el = document.getElementById("verify-status");
  if (!verifyHash) { el.className="status error"; el.textContent="Select a file or enter text first."; return; }

  el.className="status info"; el.innerHTML='<span class="loader"></span> Querying contract...';

  try {
    const rpc = new ethers.JsonRpcProvider("https://pulsechain-testnet-rpc.publicnode.com");
    const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, rpc);
    const hashBytes = ethers.getBytes(verifyHash);
    const record = await contract.getRecord(hashBytes);

    if (record.timestamp > 0n) {
      const date = new Date(Number(record.timestamp) * 1000).toLocaleString();
      el.className="status success";
      el.innerHTML=`<strong>Verified on PulseChain</strong><br>
        Label: ${record.label}<br>
        Sealed: ${date}<br>
        By: <span style="font-family:monospace;font-size:11px">${record.submitter}</span><br>
        ${record.note ? `Note: ${record.note}` : ""}`;
    } else {
      el.className="status error";
      el.textContent="Not found. This content has never been sealed on Immuta, or has been altered.";
    }
  } catch (err) {
    el.className="status error";
    el.textContent="Error: " + err.message;
  }
}
</script>
</body>
</html>
